include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - tools/**
    - lib/l10n/gen/**
    - "**/*.mapper.dart"

linter:
  rules:
    lines_longer_than_80_chars: false
    public_member_api_docs: false

plugins:
  layer_lint:
    path: tools/layer_lint
