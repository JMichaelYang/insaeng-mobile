name: insaeng
description: "My life in a nutshell."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_icons: ^1.0.8
  dart_mappable: ^4.10.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  meta: ^1.19.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.2
  dart_mappable_builder: ^4.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/pretendard/LICENSE.txt

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.ttf
          weight: 700
